<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noita XML 魔杖预览</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --surface: #141414;
            --surface-2: #1c1c1c;
            --border: #2a2a2a;
            --text: #c9b99a;
            --text-dim: #555;
            --accent: #a67c52;
            --tag-bone: #8b7355;
            --tag-player: #6a9e7f;
            --path-bg: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            line-height: 1.6;
        }

        #root {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        hgroup {
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 0.1em;
        }

        /* 帮助面板 */
        #help-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        #help-toggle:hover,
        #help-toggle.active {
            color: var(--accent);
            border-color: var(--accent);
        }

        #help-panel {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.2s ease;
        }

        #help-panel.open {
            display: block;
        }

        #help-panel h3 {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        .path-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0.6rem;
            background: var(--path-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.15s;
            user-select: all;
        }

        .path-row:hover {
            border-color: var(--accent);
        }

        .path-row:last-child {
            margin-bottom: 0;
        }

        .path-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 6.5em;
            text-align: right;
        }

        .path-value {
            font-size: 0.8rem;
            color: #8a9e7f;
            word-break: break-all;
            flex: 1;
        }

        .path-copy {
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .path-row:hover .path-copy {
            opacity: 1;
        }

        .copied-flash {
            animation: flash 0.6s ease;
        }

        @keyframes flash {
            0% {
                background: rgba(166, 124, 82, 0.2);
            }

            100% {
                background: var(--path-bg);
            }
        }

        /* 上传区 */
        #upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2.5rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dim);
            user-select: none;
            position: relative;
        }

        #upload-zone:hover,
        #upload-zone.drag-over {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(166, 124, 82, 0.06);
        }

        #upload-zone input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        #wands {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .file-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .tag {
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tag-bone {
            color: var(--tag-bone);
        }

        .tag-player {
            color: var(--tag-player);
        }

        code {
            background: var(--surface-2);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.8rem;
            color: #999;
            border: 1px solid var(--border);
        }

        .group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            background: var(--surface-2);
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .empty-tip {
            color: var(--text-dim);
            font-style: italic;
            padding: 3rem;
            text-align: center;
        }

        dialog {
            position: fixed;
            display: grid;
            grid-template:
                "main" auto
                "close-btn" 80px
                /1fr;
            place-content: start;
            place-items: center;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            background-color: #0000;
            border-style: none;
            padding: 0;
            scrollbar-width: thin;
            overscroll-behavior: contain;
        }

        dialog>button {
            all: unset;
            color: #fff;
            border-radius: 6px;
            height: 40px;
            min-width: 60px;
            border: 1px solid #ccc;
            text-align: center;
        }

        dialog>button:hover {
            border: 1px solid #fff;
            box-shadow: 0 0 8px 1px #999;
        }

        dialog::backdrop {
            position: fixed;
            inset: 0px;
            background: #00000040;
            backdrop-filter: blur(5px);
        }
    </style>
    <script src="../noitaLib.js"></script>
</head>

<body>

    <div id="root">
        <hgroup>
            <h2>Noita XML 魔杖预览</h2>
            <button id="help-toggle">❓ 帮助</button>
        </hgroup>

        <div id="help-panel">
            <h3>📁 Noita 存档路径（点击复制）</h3>
            <div class="path-row" data-path="%localappdata%low/Nolla_Games_Noita/save00/persistent/bones_new">
                <span class="path-label">新骨头</span>
                <span class="path-value">%localappdata%low/Nolla_Games_Noita/save00/persistent/bones_new</span>
                <span class="path-copy">点击复制</span>
            </div>
            <div class="path-row" data-path="%localappdata%low/Nolla_Games_Noita/save00/persistent/bones">
                <span class="path-label">旧骨头</span>
                <span class="path-value">%localappdata%low/Nolla_Games_Noita/save00/persistent/bones</span>
                <span class="path-copy">点击复制</span>
            </div>
            <div class="path-row" data-path="%localappdata%low/Nolla_Games_Noita/save00">
                <span class="path-label">玩家存档</span>
                <span class="path-value">%localappdata%low/Nolla_Games_Noita/save00</span>
                <span class="path-copy">点击复制</span>
            </div>
        </div>

        <div id="upload-zone">
            <input type="file" id="file-input" multiple accept=".xml">
            <span>📂 点击选择或拖放 XML 文件到此处</span>
        </div>

        <div id="wands">
            <div class="empty-tip">等待文件...</div>
        </div>
    </div>

    <script>

        const wands = document.getElementById("wands");
        const uploadZone = document.getElementById("upload-zone");
        const fileInput = document.getElementById("file-input");
        const helpToggle = document.getElementById("help-toggle");
        const helpPanel = document.getElementById("help-panel");

        // 帮助面板切换
        helpToggle.addEventListener("click", () => {
            helpPanel.classList.toggle("open");
            helpToggle.classList.toggle("active");
            helpToggle.textContent = helpPanel.classList.contains("open") ? "❌ 关闭" : "❓ 帮助";
        });

        // 路径复制
        document.getElementById("help-panel").addEventListener("click", async (e) => {
            const row = e.target.closest(".path-row");
            if (!row) return;

            const path = row.dataset.path;
            const copyLabel = row.querySelector(".path-copy");
            const oldText = copyLabel.textContent;

            const flash = () => {
                row.classList.add("copied-flash");
                setTimeout(() => row.classList.remove("copied-flash"), 600);
            };

            const setLabel = (text) => {
                copyLabel.textContent = text;
                setTimeout(() => (copyLabel.textContent = oldText), 800);
            };

            // 标准 Clipboard API
            await navigator.clipboard.writeText(path);
            flash();
            setLabel("✓ 已复制");
            return;
        });

        /** @param {File} file @returns {Promise<string>} */
        const readFile2String = async (file) => {
            const reader = new FileReader();
            const { promise, resolve } = Promise.withResolvers();
            reader.addEventListener("load", resolve);
            reader.readAsText(file);
            await promise;
            return reader.result;
        };

        /** @param {FileList|File[]} files */
        const processFiles = async (files) => {
            files = [...files];
            const contents = await Promise.all(files.map(readFile2String));
            const fragment = h();
            let hasValid = false;

            for (let i = 0; i < contents.length; i++) {
                const text = contents[i];
                const { name, lastModified } = files[i];
                if (!name.endsWith(".xml")) continue;
                hasValid = true;
                const fileInfo = h.code(name, " ", new Date(lastModified).toLocaleString());
                let xmlObject, Entity;
                try {
                    ({ xmlObject } = noitaLib.XML.parse(text));
                    [Entity] = xmlObject.Entity;
                } catch (err) {
                    console.warn("XML 解析失败:", name, err);
                    continue;
                }

                const tags = new Set((Entity("attr")?.tags || "").split(",").map(t => t.trim()).filter(Boolean));
                const block = h.div({ class: "file-block" });

                if (tags.has("teleportable_NOT") && tags.has("wand")) {
                    block.append(
                        h.div({ class: "file-meta" }, h.small({ class: "tag tag-bone" }, "[骨头文件] "), fileInfo),
                        new noitaLib.Wand({ data: text })
                    );
                    fragment.append(block);
                } else if (tags.has("player_unit")) {
                    block.append(
                        h.div({ class: "file-meta" }, h.small({ class: "tag tag-player" }, "[玩家文件] "), fileInfo),
                        h.div({ class: "group" }, ...noitaLib.Wand.fromPlayerXML(text))
                    );
                    fragment.append(block);
                }
            }

            wands.replaceChildren(
                hasValid ? fragment : h.div({ class: "empty-tip" }, "未识别到有效的 Noita XML 文件")
            );
        };

        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length) processFiles(e.target.files);
            e.target.value = "";
        });

        ["dragenter", "dragover"].forEach(t =>
            uploadZone.addEventListener(t, (e) => {
                e.preventDefault();
                uploadZone.classList.add("drag-over");
            })
        );
        ["dragleave", "drop"].forEach(t =>
            uploadZone.addEventListener(t, (e) => {
                e.preventDefault();
                uploadZone.classList.remove("drag-over");
            })
        );
        uploadZone.addEventListener("drop", (e) => {
            if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
        });

        document.body.addEventListener("dragover", (e) => e.preventDefault());
        document.body.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
        });

    </script>

</body>

</html>
